<style>
:root{
  --purple:#7133da;
  --pink:#ff92ff;
  --green:#35ff70;
  --bg:#f5f3ff;
  --dark:#1a0a3c;
  --text:#2d1060;
  --muted:#555560;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{
  font-family:'Heebo',sans-serif;
  color:var(--text);
  direction:rtl;
  background:
    radial-gradient(ellipse 70% 55% at 15% 10%,rgba(192,132,252,0.28),transparent 60%),
    radial-gradient(ellipse 55% 45% at 90% 85%,rgba(53,255,112,0.12),transparent 58%),
    radial-gradient(ellipse 50% 40% at 70% 20%,rgba(255,146,255,0.16),transparent 55%),
    linear-gradient(165deg,#faf7ff 0%,var(--bg) 45%,#eef2ff 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(28px,6vw,48px) 6%;
  overflow-x:hidden;
}
.wrap{
  width:100%;
  max-width:520px;
  text-align:center;
  position:relative;
}
.card{
  position:relative;
  background:rgba(255,255,255,0.88);
  border:1px solid rgba(113,51,218,0.12);
  border-radius:28px;
  padding:clamp(36px,6vw,48px) clamp(24px,5vw,40px);
  box-shadow:0 20px 60px rgba(26,10,60,0.1);
  backdrop-filter:blur(12px);
  animation:riseIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
}
.card::before{
  content:'';
  position:absolute;
  inset:-1px;
  border-radius:28px;
  padding:1px;
  background:linear-gradient(145deg,rgba(113,51,218,0.35),rgba(255,146,255,0.25),rgba(53,255,112,0.2));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}
.logo{
  height:36px;
  width:auto;
  object-fit:contain;
  margin:0 auto 22px;
  display:block;
}
.check{
  width:72px;height:72px;
  margin:0 auto 22px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#25D366,#128C7E);
  box-shadow:0 12px 32px rgba(37,211,102,0.35);
  animation:popIn 0.55s 0.15s cubic-bezier(0.22,1,0.36,1) both;
}
.check svg{width:34px;height:34px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.check svg path{
  stroke-dasharray:36;
  stroke-dashoffset:36;
  animation:drawCheck 0.45s 0.45s ease forwards;
}
h1{
  font-family:'Fredoka',sans-serif;
  font-size:clamp(28px,5.5vw,38px);
  font-weight:600;
  color:var(--dark);
  line-height:1.25;
  margin:0 0 14px;
}
.sub{
  font-size:clamp(17px,2.4vw,19px);
  font-weight:400;
  color:var(--muted);
  line-height:1.7;
  margin:0 auto 28px;
  max-width:26rem;
}
.back{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:13px 28px;
  border-radius:30px;
  text-decoration:none;
  font-family:'Fredoka',sans-serif;
  font-size:15px;
  font-weight:600;
  color:#fff;
  background:linear-gradient(135deg,var(--purple),#a855f7);
  box-shadow:0 10px 28px rgba(113,51,218,0.28);
  transition:transform 0.2s,box-shadow 0.2s;
}
.back:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(113,51,218,0.34);}
.note{
  margin-top:22px;
  font-size:13px;
  color:var(--muted);
  opacity:0.85;
}
@keyframes riseIn{
  from{opacity:0;transform:translateY(18px) scale(0.98);}
  to{opacity:1;transform:none;}
}
@keyframes popIn{
  from{opacity:0;transform:scale(0.6);}
  to{opacity:1;transform:scale(1);}
}
@keyframes drawCheck{
  to{stroke-dashoffset:0;}
}
@media (prefers-reduced-motion:reduce){
  .card,.check,.check svg path{animation:none;}
  .check svg path{stroke-dashoffset:0;}
}
</style>
</head>
<body>
  <main class="wrap">
    <div class="card">
      <img class="logo" src="/heyzoe-logo.png" alt="HeyZoe" width="160" height="36">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <h1>תודה על ההרשמה!</h1>
      <p class="sub">קיבלנו את הפרטים שלכם.<br>ניצור קשר בהקדם לתיאום השיחה.</p>
      <a class="back" href="/lp-leads">חזרה לדף הראשי</a>
      <p class="note">צוות HeyZoe</p>
    </div>
  </main>
<script>
(function(){
  var DEDUP_KEY = 'hz_lp_lead_fired_v1';
  try{
    if(sessionStorage.getItem(DEDUP_KEY) === '1') return;
    sessionStorage.setItem(DEDUP_KEY, '1');
  }catch(e){}

  function getSessionId(){
    try{
      var key='hz_lp_session_id';
      var existing=sessionStorage.getItem(key);
      if(existing) return existing;
      var sid='lp_'+Math.random().toString(16).slice(2)+Date.now().toString(16);
      sessionStorage.setItem(key,sid);
      return sid;
    }catch(e){
      return 'lp_'+Math.random().toString(16).slice(2)+Date.now().toString(16);
    }
  }

  function getSource(){
    try{
      var fromLp = (sessionStorage.getItem('hz_lp_source')||'').trim();
      if(fromLp) return fromLp;
      var fromUtm = (sessionStorage.getItem('hz_utm_source')||'').trim();
      if(fromUtm) return fromUtm;
      var u = new URL(window.location.href);
      return (u.searchParams.get('utm_source')||'').trim() || null;
    }catch(e){ return null; }
  }

  // HeyZoe analytics
  try{
    var payload = {
      event_type: 'lead',
      value: null,
      label: 'lp_thankyou',
      source: getSource(),
      session_id: getSessionId()
    };
    var ok = false;
    if(navigator.sendBeacon){
      try{
        ok = navigator.sendBeacon('/api/track', new Blob([JSON.stringify(payload)],{type:'application/json'}));
      }catch(e){ ok = false; }
    }
    if(!ok){
      fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true});
    }
  }catch(e){}

  // Meta Pixel — standard Lead
  try{
    if(typeof fbq === 'function') fbq('track', 'Lead');
  }catch(e){}
})();
</script>
</body>
</html>
